name: Frontend CI

on:
  pull_request:
    branches:
      - Dev-Staging
      - main
  push:
    branches:
      - Dev-Staging
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Public synthetic build configuration only; no live OAuth/provider credentials.
      NEXT_PUBLIC_API_BASE_URL: https://api.fixture.invalid
      NEXT_PUBLIC_SITE_URL: https://creator.fixture.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_offline_fixture

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Verify intelligence presentation contracts
        run: npm run test:ui

      - name: Verify authentication transport and account contracts
        run: npm run test:auth

      - name: Build frontend
        run: npm run build
