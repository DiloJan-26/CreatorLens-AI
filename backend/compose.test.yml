name: creatorlens-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorlens_test
      POSTGRES_USER: creatorlens_test
      POSTGRES_PASSWORD: creatorlens_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U creatorlens_test -d creatorlens_test
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    mem_limit: 512m
    shm_size: 128mb
    restart: "no"
